<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

<div class="calculator-app">

    <div class="calculator">

        <div class="brand-row">
            <div class="brand">CASIO</div>
            <div class="model">ST-1786</div>
        </div>

        <div class="display-area">
            <div id="mode" class="mode"></div>
            <div id="display">0</div>
        </div>

        <div class="control-row">
            <button class="special check" data-action="check">CHECK</button>
            <button class="special correct" data-action="correct">CORRECT</button>
            <button class="special ac" data-action="ac">AC</button>
        </div>

        <div class="memory-row">
            <button data-action="memory-plus">M+</button>
            <button data-action="memory-minus">M−</button>
            <button data-action="memory-recall">MRC</button>
            <button data-action="gt">GT</button>
            <button data-action="history">HISTORY</button>
        </div>

        <div class="keypad">

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="/">÷</button>
            <button class="function" data-action="percent">%</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="*">×</button>
            <button class="function" data-action="mu">MU</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator" data-value="-">−</button>
            <button class="function" data-action="sqrt">√</button>

            <button class="number wide-number" data-value="00">00</button>
            <button class="number" data-value="0">0</button>
            <button class="number" data-value=".">.</button>
            <button class="operator plus" data-value="+">+</button>
            <button class="equals" data-action="equals">=</button>

            <button class="function bottom-function" data-action="ce">CE</button>
            <button class="empty"></button>
            <button class="empty"></button>
            <button class="empty"></button>
            <button class="empty"></button>

        </div>

    </div>

    <div id="historyPanel" class="overlay hidden">

        <div class="panel">

            <div class="panel-header">
                <h2>Calculation History</h2>
                <button id="closeHistory">×</button>
            </div>

            <div id="historyList"></div>

            <button id="clearHistory" class="clear-history">
                CLEAR HISTORY
            </button>

        </div>

    </div>

    <div id="checkPanel" class="overlay hidden">

        <div class="panel check-panel">

            <div class="panel-header">
                <h2>CHECK</h2>
                <button id="closeCheck">×</button>
            </div>

            <div class="check-content">

                <div class="check-label">
                    NUMBER <span id="checkPosition"></span>
                </div>

                <div id="checkNumber" class="check-number">
                    0
                </div>

            </div>

            <div class="check-navigation">

                <button id="previousCheck">
                    ◀ PREVIOUS
                </button>

                <button id="nextCheck">
                    NEXT ▶
                </button>

            </div>

            <div class="check-actions">

                <button id="correctNumber">
                    CORRECT
                </button>

                <button id="finishCheck">
                    ✓ FINISH CHECK
                </button>

                <button id="saveCalculation">
                    SAVE HISTORY
                </button>

            </div>

        </div>

    </div>

</div>

<script src="calculator.js"></script>

</body>
</html>
